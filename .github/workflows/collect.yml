name: Collect RSS news

on:
  schedule:
    # Off the top of the hour: GitHub delays :00 schedules the most (runs
    # were landing 2–6h late)
    - cron: "17 */2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect-rss
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm install

      - run: npm run collect

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # meta.json/trends.json change on every run; only commit when the
          # news itself changed, to keep history from ballooning — or when a
          # feed's failure count changed, since the next run counts on from
          # the committed meta.json and alerts would otherwise come late
          feed_state='JSON.parse(require("fs").readFileSync(0,"utf8")).feeds.map(f=>[f.id,f.ok,f.consecutiveFailures])'
          committed=$(git show HEAD:docs/data/meta.json | node -p "JSON.stringify($feed_state)")
          current=$(node -p "JSON.stringify($feed_state)" < docs/data/meta.json)
          if git diff --quiet -- docs/data/latest.json docs/data/archive && [ "$committed" = "$current" ]; then
            echo "No new items or feed state changes; skipping commit."
            exit 0
          fi
          git add docs/data
          git commit -m "chore: update collected news"
          # Someone may have pushed code while we were collecting
          for attempt in 1 2 3; do
            git pull --rebase && git push && exit 0
            echo "Push attempt $attempt failed; retrying"
            sleep $((attempt * 10))
          done
          exit 1
