name: Send daily Discord digest

on:
  schedule:
    - cron: "7 0 * * *" # ~09:07 KST
  workflow_dispatch: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm install

      # Fresh data for the window that just closed (not committed here; the
      # collect workflow owns docs/data)
      - run: npm run collect

      - run: npm run digest
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
