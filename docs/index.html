<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mynews — RSS 뉴스 대시보드</title>
  <script>
    // Apply the saved theme before first paint to avoid a light→dark flash.
    try {
      if (localStorage.getItem("mynews:theme") === "dark") {
        document.documentElement.dataset.theme = "dark";
      }
    } catch {}
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div>
      <h1>📰 mynews</h1>
      <p id="last-updated">불러오는 중…</p>
    </div>
    <button type="button" class="theme-toggle" id="theme-toggle" aria-label="테마 전환">🌙 다크</button>
  </header>
  <main>
    <nav class="tabs">
      <button data-tab="explore" class="active"><span class="num">01</span>탐색</button>
      <button data-tab="category"><span class="num">02</span>카테고리</button>
      <button data-tab="trend"><span class="num">03</span>트렌드</button>
      <button data-tab="history"><span class="num">04</span>히스토리</button>
      <button data-tab="bookmark"><span class="num">05</span>즐겨찾기</button>
      <button data-tab="status"><span class="num">06</span>수집현황</button>
    </nav>

    <section id="tab-explore">
      <div class="controls">
        <input type="text" id="explore-search" placeholder="제목 검색…" />
        <select id="explore-category"></select>
        <select id="explore-tag"></select>
      </div>
      <div id="explore-content"></div>
    </section>

    <section id="tab-category" hidden>
      <nav class="subtabs" id="category-subtabs"></nav>
      <div class="controls">
        <input type="text" id="category-search" placeholder="제목 검색…" />
      </div>
      <div id="category-content"></div>
    </section>

    <section id="tab-trend" hidden>
      <nav class="subtabs" id="trend-subtabs">
        <button data-range="24" class="active">최근 24시간</button>
        <button data-range="72">최근 3일</button>
      </nav>
      <div id="trend-content"></div>
    </section>

    <section id="tab-history" hidden>
      <div class="controls">
        <input type="text" id="history-search" placeholder="키워드 검색…" />
        <select id="history-month"></select>
        <select id="history-category"></select>
      </div>
      <div id="history-content"></div>
    </section>

    <section id="tab-bookmark" hidden>
      <div id="bookmark-content"></div>
    </section>

    <section id="tab-status" hidden>
      <div id="status-content"></div>
    </section>
  </main>
  <footer>2시간마다 자동 수집 · 매일 오전 9시 Discord로 요약 발송</footer>
  <script src="app.js"></script>
</body>
</html>
